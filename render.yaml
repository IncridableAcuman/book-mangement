version: "1"

services:
  # Backend API Web Service (Spring Boot Docker)
  - type: web
    name: book-management-backend
    runtime: docker
    dockerfilePath: ./library/Dockerfile
    dockerContext: ./library
    plan: free
    region: oregon
    healthCheckPath: /api/v1/book
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL
        value: jdbc:postgresql://ep-square-feather-b4z5xe0q-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASS
        value: npg_p4aI2JwcHNrz
      - key: JWT_SECRET
        value: uzbekistan_uzbekistan_1234567890
      - key: ACCESS_TIME
        value: "900000"
      - key: REFRESH_TIME
        value: "604800000"
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://*.onrender.com

  # Frontend Web Service / Static Site (React Vite)
  - type: web
    name: book-management-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: book-management-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
